name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: AegisScan version / chart version }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: Operator logs and scan Job logs. Remove secrets first., render: shell }

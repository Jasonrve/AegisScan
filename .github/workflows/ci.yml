name: CI
on: [push, pull_request]
concurrency:
  group: aegisscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on PRs when it finds leaks
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '11.0.x' }
      - run: dotnet tool restore
      - run: dotnet tool install --global KubeOps.Cli --version 14.0.0
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: dotnet restore AegisScan.sln
      - run: dotnet build src/AegisScan.Operator/AegisScan.Operator.csproj -c Release --no-restore
      - run: dotnet test tests/AegisScan.Operator.Tests/AegisScan.Operator.Tests.csproj -c Release --no-restore
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: docker build -t aegisscan:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegisscan:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
      - run: docker build -t aegisscan-web:ci web
      - run: helm repo add groundhog2k https://groundhog2k.github.io/helm-charts && helm repo add codecentric https://codecentric.github.io/helm-charts && helm repo update
      - run: helm dependency build deploy/helm/aegisscan
      - run: helm lint deploy/helm/aegisscan --set authentication.authority=https://idp.example.com/realms/aegisscan
      - run: helm template aegisscan deploy/helm/aegisscan --include-crds --set authentication.authority=https://idp.example.com/realms/aegisscan
      - run: helm template aegisscan deploy/helm/aegisscan --set postgresql.enabled=true --set keycloak.enabled=true --set keycloak.publicUrl=https://auth.example.com
      - run: pip install --quiet pyyaml
      - run: python3 scripts/check_crd_compat.py

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image names
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push operator + web images
        run: |
          REPO="$IMAGE"
          docker buildx build --platform linux/amd64,linux/arm64 --push -t "$REPO:$VERSION" -t "$REPO:latest" .
          docker buildx build --platform linux/amd64,linux/arm64 --push -t "$REPO-web:$VERSION" -t "$REPO-web:latest" web
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign images
        run: |
          REPO="$IMAGE"
          cosign sign --yes "$REPO:$VERSION"
          cosign sign --yes "$REPO-web:$VERSION"
      - uses: azure/setup-helm@v5
      - name: Package and push Helm chart (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts
          helm repo add codecentric https://codecentric.github.io/helm-charts
          helm repo update
          helm dependency build deploy/helm/aegisscan
          helm package deploy/helm/aegisscan --version "$VERSION" --app-version "$VERSION"
          helm push "aegisscan-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

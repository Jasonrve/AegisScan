services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisscan
      POSTGRES_USER: aegisscan
      POSTGRES_PASSWORD: aegisscan-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisscan -d aegisscan"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pin a single canonical issuer regardless of which host/port a client used to reach Keycloak —
      # otherwise a token minted via the host-exposed port won't validate against the in-container Authority.
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./deploy/dev/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  k3s:
    image: rancher/k3s:v1.31.5-k3s1
    # Stable node name: without it every container recreate registers a new node and leaves a stale NotReady one.
    hostname: k3s
    privileged: true
    command: server --disable=traefik --disable=servicelb --write-kubeconfig-mode=644 --tls-san=k3s
    environment:
      K3S_TOKEN: aegisscan-compose-token
    ports:
      - "16443:6443"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-config:/etc/rancher/k3s
      - ./deploy/generated:/opt/aegisscan/generated:ro
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw=/readyz"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Local GitHub stand-in used to exercise discovery, TruffleHog findings and Renovate PRs/issues end to end
  # (see scripts/seed-gitea.sh). Dev only: plain HTTP, admin/admin-password.
  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: gitea
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__database__DB_TYPE: sqlite3
    ports:
      - "3300:3000"
    # Fixed address: scan pods reach Gitea through a CoreDNS entry (scripts/seed-gitea.sh), which must not go stale on restart.
    networks:
      default:
        ipv4_address: 10.250.250.50
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  aegisscan:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AEGIS_KUBE_NAMESPACE: default
      # Dev only: allow plain-http clone URLs so the compose Gitea can be registered.
      AEGIS_ALLOW_INSECURE_CLONE_URLS: "true"
      AEGIS_SEED_DEMO: "true"
      # Shared git cache (ADR 0001): PVC created by scripts/seed-gitea.sh from deploy/dev/git-cache.yaml.
      AEGIS_GIT_CACHE_PVC: aegisscan-git-cache
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=aegisscan;Username=aegisscan;Password=aegisscan-local
      Authentication__Authority: http://keycloak:8080/realms/aegisscan
      Authentication__Audience: aegisscan-web
      KUBERNETES_MASTER: https://k3s:6443
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      k3s:
        condition: service_healthy
    ports:
      - "${AEGIS_API_PORT:-8080}:8080"
    volumes:
      - k3s-config:/etc/rancher/k3s:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["sed 's#127.0.0.1#k3s#g' /etc/rancher/k3s/k3s.yaml > /tmp/kubeconfig && export KUBECONFIG=/tmp/kubeconfig && exec dotnet AegisScan.Operator.dll"]

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: .
        # Browser-reachable Keycloak endpoint (host-exposed port), distinct from the backend's
        # docker-internal Authority — see the keycloak service's KC_HOSTNAME comment above.
        VITE_OIDC_AUTHORITY: http://localhost:8081/realms/aegisscan
        VITE_OIDC_ISSUER: http://keycloak:8080/realms/aegisscan
        VITE_OIDC_CLIENT_ID: aegisscan-web
    depends_on:
      - aegisscan
    ports:
      - "${AEGIS_WEB_PORT:-3000}:8080"

networks:
  default:
    ipam:
      config:
        - subnet: 10.250.250.0/24

volumes:
  gitea-data:
  postgres-data:
  k3s-data:
  k3s-config:

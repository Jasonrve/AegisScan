services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisscan
      POSTGRES_USER: aegisscan
      POSTGRES_PASSWORD: aegisscan-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisscan -d aegisscan"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  k3s:
    image: rancher/k3s:v1.31.5-k3s1
    privileged: true
    command: server --disable=traefik --disable=servicelb --write-kubeconfig-mode=644 --tls-san=k3s
    environment:
      K3S_TOKEN: aegisscan-compose-token
    ports:
      - "16443:6443"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-config:/etc/rancher/k3s
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw=/readyz"]
      interval: 5s
      timeout: 5s
      retries: 24

  kube-proxy:
    image: rancher/k3s:v1.31.5-k3s1
    entrypoint: ["/bin/kubectl"]
    command: ["--kubeconfig=/dev/null", "--server=https://k3s:6443", "--certificate-authority=/var/lib/rancher/k3s/server/tls/server-ca.crt", "--client-certificate=/var/lib/rancher/k3s/server/tls/client-admin.crt", "--client-key=/var/lib/rancher/k3s/server/tls/client-admin.key", "proxy", "--address=0.0.0.0", "--accept-hosts=^.*$", "--accept-paths=^/.*$"]
    depends_on:
      k3s:
        condition: service_healthy
    volumes:
      - k3s-data:/var/lib/rancher/k3s:ro
      - k3s-config:/etc/rancher/k3s:ro

  aegisscan:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AEGIS_HTTP_ADDR: :8080
      AEGIS_ALLOW_ROLE_HEADER: "true"
      AEGIS_ALLOW_DEMO_DATA: "true"
      AEGIS_ALLOW_ANONYMOUS: "true"
      AEGIS_DATABASE_URL: postgres://aegisscan:aegisscan-local@postgres:5432/aegisscan?sslmode=disable
      AEGIS_KUBE_SERVER: http://kube-proxy:8001
      AEGIS_KUBE_TOKEN: ""
      AEGIS_KUBE_NAMESPACE: default
      AEGIS_TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:3.90.8
      AEGIS_RENOVATE_IMAGE: renovate/renovate:latest
    depends_on:
      postgres:
        condition: service_healthy
      k3s:
        condition: service_healthy
      kube-proxy:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: .
    depends_on:
      - aegisscan
    ports:
      - "3000:80"

volumes:
  postgres-data:
  k3s-data:
  k3s-config:

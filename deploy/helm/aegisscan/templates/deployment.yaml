apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisscan.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "aegisscan.name" . }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "aegisscan.name" . }} }
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aegisscan.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.gitCache.enabled }}
        - name: git-cache
          persistentVolumeClaim:
            claimName: {{ include "aegisscan.fullname" . }}-git-cache
        {{- end }}
        - name: tmp
          emptyDir: {}
      containers:
        - name: aegisscan
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- if .Values.gitCache.enabled }}
            - name: git-cache
              mountPath: /var/lib/aegisscan/git-cache
            {{- end }}
            - name: tmp
              mountPath: /tmp
          ports: [{ name: http, containerPort: 8080 }]
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.env .Values.oidc.enabled .Values.postgresql.external }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: AEGIS_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: AEGIS_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            - name: AEGIS_OIDC_ROLE_CLAIM
              value: {{ .Values.oidc.roleClaim | quote }}
            - name: AEGIS_OIDC_JWKS_URL
              value: {{ .Values.oidc.jwksURL | quote }}
            {{- end }}
            {{- if .Values.postgresql.external }}
            - name: AEGIS_DATABASE_HOST
              value: {{ .Values.postgresql.host | quote }}
            - name: AEGIS_DATABASE_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: AEGIS_DATABASE_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: AEGIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret | quote }}
                  key: database-url
            {{- end }}
          {{- end }}
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }

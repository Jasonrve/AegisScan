{{- if .Values.postgresql.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "aegisscan-database" }}
{{- $password := randAlphaNum 32 }}
{{- if and $existing $existing.data }}{{ $password = index $existing.data "password" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: aegisscan-database
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  database: aegisscan
  username: aegisscan
  password: {{ $password | quote }}
  connection-string: {{ printf "Host=%s-postgresql;Port=5432;Database=aegisscan;Username=aegisscan;Password=%s" .Release.Name $password | quote }}
{{- end }}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: {{ include "aegisscan.fullname" . }} }
rules:
  - apiGroups: ["aegisscan.io"]
    resources: [repositories, repositorysources, scanpolicies]
    verbs: ["*"]
  - apiGroups: ["aegisscan.io"]
    resources: [repositories/status, repositorysources/status, scanpolicies/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, create, update]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: {{ include "aegisscan.fullname" . }} }
subjects: [{ kind: ServiceAccount, name: {{ include "aegisscan.fullname" . }} }]
roleRef: { kind: Role, name: {{ include "aegisscan.fullname" . }}, apiGroup: rbac.authorization.k8s.io }

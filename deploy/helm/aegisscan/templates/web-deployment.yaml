{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisscan.fullname" . }}-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "aegisscan.name" . }}-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "aegisscan.name" . }}-web }
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: AEGIS_API_UPSTREAM
              value: "{{ include "aegisscan.fullname" . }}:{{ .Values.service.port }}"
            - name: OIDC_AUTHORITY
              value: {{ include "aegisscan.webAuthority" . | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.web.oidc.issuer | quote }}
            - name: OIDC_LOGIN_MODE
              value: {{ .Values.web.loginMode | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.web.oidc.clientId | quote }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe: { httpGet: { path: /, port: http } }
{{- end }}

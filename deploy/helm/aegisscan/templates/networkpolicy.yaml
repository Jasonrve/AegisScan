apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ include "aegisscan.fullname" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: {{ include "aegisscan.name" . }} } }
  policyTypes: [Ingress, Egress]
  ingress: [{ ports: [{ protocol: TCP, port: http }] }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    {{- if .Values.postgresql.enabled }}
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgresql } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    {{- end }}
    - ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 22 }]

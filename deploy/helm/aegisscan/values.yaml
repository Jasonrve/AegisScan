image:
  repository: ghcr.io/aegisscan/aegisscan
  tag: 0.1.0
  pullPolicy: IfNotPresent
# Safe above 1: the scan-execution and scheduling workers coordinate via a Postgres
# advisory lock (see Scanning/DistributedLock.cs), so only one replica ever acts per tick.
replicaCount: 2
imagePullSecrets: []
service:
  port: 8080
web:
  enabled: true
  image:
    repository: ghcr.io/aegisscan/aegisscan-web
    tag: 0.1.0
    pullPolicy: IfNotPresent
  service:
    port: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aegisscan.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
postgresql:
  # If enabled, the chart wires a Secret key into ConnectionStrings__Postgres.
  # It does not deploy a PostgreSQL server itself; point existingSecret at one
  # you manage (an in-cluster instance, or a managed service).
  enabled: true
  existingSecret: aegisscan-database
  secretKey: connection-string
serviceMonitor:
  enabled: false
  interval: 30s
podDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
securityContext:
  runAsNonRoot: true
containerSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
  seccompProfile: { type: RuntimeDefault }
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
podAnnotations: {}
env: []

# Shared Git cache (ADR 0001): one bare mirror per repository on a shared PVC, refreshed under a lock, then private clones for each scan Job.
# ReadWriteMany storage is needed when scan Jobs can land on different nodes; ReadWriteOnce works on a single node (e.g. k3s local-path).
gitCache:
  enabled: false
  size: 20Gi
  storageClassName: ""
  accessMode: ReadWriteMany

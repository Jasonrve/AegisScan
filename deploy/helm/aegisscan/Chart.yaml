apiVersion: v2
name: aegisscan
description: AegisScan security and dependency automation control plane
type: application
version: 0.1.0
appVersion: 0.1.0
home: https://jasonrve.github.io/AegisScan/
sources:
  - https://github.com/Jasonrve/AegisScan
keywords: [security, scanning, kubernetes, operator, secrets, sbom]
icon: https://raw.githubusercontent.com/Jasonrve/AegisScan/main/docs/public/mark.svg
kubeVersion: ">=1.24.0-0"
dependencies:
  - name: postgres
    alias: postgresql
    version: 1.6.9
    repository: https://groundhog2k.github.io/helm-charts
    condition: postgresql.enabled
  - name: keycloakx
    alias: keycloak
    version: 7.4.0
    repository: https://codecentric.github.io/helm-charts
    condition: keycloak.enabled

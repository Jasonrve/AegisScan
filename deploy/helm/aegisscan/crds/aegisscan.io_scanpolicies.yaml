apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: scanpolicies.aegisscan.io }
spec:
  group: aegisscan.io
  scope: Namespaced
  names: { plural: scanpolicies, singular: scanpolicy, kind: ScanPolicy }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [scanners]
              properties:
                scanners: { type: array, minItems: 1, items: { type: string, enum: [trufflehog, renovate] } }
                incrementalByDefault: { type: boolean, default: true }
                fullScanSchedule: { type: string }
                schedule: { type: string }
                timeoutSeconds: { type: integer, minimum: 1, default: 1800 }
                retries: { type: integer, minimum: 0, maximum: 10, default: 2 }
                maxConcurrency: { type: integer, minimum: 1, default: 4 }

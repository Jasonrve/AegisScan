apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositorysources.aegisscan.io
spec:
  conversion:
    strategy: None
  group: aegisscan.io
  names:
    kind: RepositorySource
    listKind: RepositorySourceList
    plural: repositorysources
    singular: repositorysource
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              credentialSecretRef:
                nullable: true
                type: string
              exclude:
                items:
                  type: string
                type: array
              include:
                items:
                  type: string
                type: array
              includeArchived:
                type: boolean
              organization:
                type: string
              provider:
                type: string
              schedule:
                nullable: true
                type: string
            type: object
          status:
            properties:
              message:
                type: string
              phase:
                type: string
              repositoryCount:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
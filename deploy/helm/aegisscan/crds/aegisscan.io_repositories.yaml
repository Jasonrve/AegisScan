apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositories.aegisscan.io
spec:
  group: aegisscan.io
  scope: Namespaced
  names: { plural: repositories, singular: repository, kind: Repository, shortNames: [repo] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [provider, cloneURL]
              properties:
                provider: { type: string, enum: [github, gitlab, generic] }
                cloneURL: { type: string, pattern: '^(https|ssh)://' }
                defaultBranch: { type: string, default: main }
                scanners: { type: array, items: { type: string, enum: [trufflehog, renovate] } }
                policyRef: { type: string }
            status:
              type: object
              properties:
                phase: { type: string, enum: [Ready, Error, Disabled] }
                latestCommitSHA: { type: string }
                cacheState: { type: string }
                latestScanState: { type: string }
                conditions: { type: array, items: { type: object, x-kubernetes-preserve-unknown-fields: true } }

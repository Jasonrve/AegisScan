apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositories.aegisscan.io
spec:
  conversion:
    strategy: None
  group: aegisscan.io
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              cloneURL:
                type: string
              defaultBranch:
                type: string
              disabled:
                type: boolean
              policyRef:
                nullable: true
                type: string
              provider:
                type: string
              scanners:
                items:
                  type: string
                type: array
            type: object
          status:
            properties:
              cacheState:
                type: string
              conditions:
                items:
                  properties:
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              latestCommitSHA:
                type: string
              latestScanState:
                type: string
              phase:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
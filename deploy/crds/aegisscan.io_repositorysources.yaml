apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: repositorysources.aegisscan.io }
spec:
  group: aegisscan.io
  scope: Namespaced
  names: { plural: repositorysources, singular: repositorysource, kind: RepositorySource }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [provider, organization]
              properties:
                provider: { type: string, enum: [github, gitlab] }
                organization: { type: string }
                include: { type: array, items: { type: string } }
                exclude: { type: array, items: { type: string } }
                includeArchived: { type: boolean, default: false }
                schedule: { type: string }
                credentialSecretRef: { type: string }
